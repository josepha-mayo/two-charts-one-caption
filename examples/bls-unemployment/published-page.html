<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>U.S. unemployment rates in 2024</title>
<h1>U.S. unemployment rates in 2024</h1>
<figure id="unemployment-rates">
  <figcaption>
    <p>January had the lowest rate, at <strong>3.7%</strong>.
      Only January and March fell below&nbsp;3.9%. July had a rate of 4.3%.</p>
  </figcaption>
  <table>
    <caption>Seasonally adjusted rates as first published</caption>
    <thead><tr><th scope="col">Month</th><th scope="col">Unemployment rate</th></tr></thead>
    <tbody>
      <tr><th scope="row">January</th><td>3.7%</td></tr>
      <tr><th scope="row">February</th><td>3.9%</td></tr>
      <tr><th scope="row">March</th><td>3.8%</td></tr>
      <tr><th scope="row">April</th><td>3.9%</td></tr>
      <tr><th scope="row">May</th><td>4.0%</td></tr>
      <tr><th scope="row">June</th><td>4.1%</td></tr>
      <tr><th scope="row">July</th><td>4.3%</td></tr>
      <tr><th scope="row">August</th><td>4.2%</td></tr>
      <tr><th scope="row">September</th><td>4.1%</td></tr>
      <tr><th scope="row">October</th><td>4.1%</td></tr>
      <tr><th scope="row">November</th><td>4.2%</td></tr>
      <tr><th scope="row">December</th><td>4.1%</td></tr>
    </tbody>
  </table>
  <p><a href="https://www.bls.gov/news.release/archives/empsit_01102025.htm">Bureau of Labor Statistics, Table A and December release</a></p>
</figure>
</html>
